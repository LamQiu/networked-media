<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Intro</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: black;
        }

        .container {
            position: relative;

            width: 100%;
        }

        .score {
            width: 100%;
        }

        .line {
            margin-bottom: 12px;
        }

        .left {
            text-align: left;
        }

        .right {
            text-align: right;
        }

        .far-right {
            text-align: right;
            margin-right: 5%;
        }

        .intro {
            width: 100%;
            display: block;
        }

        .enter {
            position: absolute;

            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            width: 80%;
            padding: 30px;

            color: white;
            text-decoration: none;
            font-size: 24px;
            text-align: left;
        }

        .wind-link {
            text-decoration: underline;
            cursor: pointer;
        }

        .wind-link:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="enter">
            <div class="score">
                Look for the <a href="wind.html" target="_blank" class="wind-link">wind</a><br>
                <div class="line right">Watch it.</div>
                <div class="line left">Listen to it.</div>
                <div class="line right">Give it a color.</div>
                <div class="line left">Write it down.</div>
                <div class="line far-right">Invite its quartet to your wedding.</div>
            </div>
        </div>

    </div>

</body>

</html>
