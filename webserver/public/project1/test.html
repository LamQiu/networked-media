<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Test</title>

    <style>
        .box {
            width: 100px;
            height: 100px;
        }

        .box:nth-child(1) {
            background: red;
        }

        .box:nth-child(2) {
            background: blue;
            position: absolute;
            top: 0px;
        }

        .box:nth-child(3) {
            background: green;
        }
    </style>
</head>

<body>

    <div class="box">A</div>
    <div class="box">B</div>
    <div class="box">C</div>

</body>

</html>
