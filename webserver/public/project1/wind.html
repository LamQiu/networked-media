            margin: 0;
            min-height: 100vh;
            background-image: url("images/beach.gif");
            background-size: cover;
            background-position: center;
        }

        .row {
            display: grid;
        }

        .row1 {
            grid-template-columns: 5fr 7fr 4fr 9fr 6fr 11fr 5fr 8fr 7fr 13fr 5fr 9fr 4fr 7fr;
            height: 8vh;
        }

        .row2 {

        }

        .row3 {

            height: 7vh;
        }

        .row4 {

            height: 10vh;
        }

        .row5 {
            grid-template-columns: 5fr 9fr 4fr 8fr 6fr 11fr 5fr 7fr 10fr 4fr 8fr 6fr 12fr;
            height: 8vh;
        }

        .row6 {

            height: 9vh;

        .row7 {

            height: 7vh;

        .row8 {

        .row11 {

        .row12 {
            grid-template-columns: 6fr 5fr 10fr 4fr 8fr 7fr 5fr 11fr 4fr 9fr 6fr 8fr 5fr;
            height: 8vh;
        }

        .cover {
            background: white;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            padding: 10px;
            transition: opacity 0.8s ease 0.5s;
        }

        .nested {
            display: grid;
        }

        .nested-vertical {
            grid-template-columns: 40% 60%;
        }

        .nested-horizontal {
            grid-template-rows: 40% 60%;
        }

        .nested-three {
            grid-template-rows: 20% 55% 25%;
        }

        .nested-four {
            display: grid;
            grid-template-columns: 35% 15% 50%;
            grid-template-rows: 30% 70%;
        }

        .nested-gap {
            display: grid;
            grid-template-rows: 1px 1fr;
        }

        .cover:hover {
            animation: none;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .next {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            width: 70%;

            color: black;
            text-decoration: none;
            text-align: left;
            font-size: 24px;

            z-index: 1000;
        }

        .beach-link {
            color: inherit;
            text-decoration: underline;
            cursor: pointer;
        }

        .beach-link:hover {
            opacity: 0.8;
        }
    </style>
</head>
